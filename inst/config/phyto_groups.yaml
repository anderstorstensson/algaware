# Phytoplankton group definitions
#
# Each top-level key is a group name used in pie charts and LLM prompts.
# Matching criteria: class, phylum, order, family, genus (lists of strings).
#
# The three "core" groups (Diatoms, Dinoflagellates, Cyanobacteria) map to
# dedicated parameters in SHARK4R::assign_phytoplankton_group(); all others
# are passed via its custom_groups argument and are evaluated in order. A
# later rule overwrites an earlier match, so place broader groups
# (phylum/class-level) BEFORE more-specific ones (genus-level).

Diatoms:
  role: diatoms          # maps to diatom_class parameter
  class:
    - Bacillariophyceae
    - Coscinodiscophyceae
    - Mediophyceae
    - Diatomophyceae

Dinoflagellates:
  role: dinoflagellates  # maps to dinoflagellate_class parameter
  class:
    - Dinophyceae

Cyanobacteria:
  role: cyanobacteria    # maps to cyanobacteria_class / cyanobacteria_phylum
  class:
    - Cyanophyceae
  phylum:
    - Cyanobacteria

# Custom groups (evaluated in order; a later rule overwrites an earlier one,
# so broad rules first, specific rules last)

# All ciliates. Mesodinium is carved out below into its own group for the
# pie charts; the heatmap folds it back into Ciliates (see
# heatmap_group_of()).
Ciliates:
  phylum:
    - Ciliophora

Mesodinium spp.:
  genus:
    - Mesodinium

Cryptophytes:
  phylum:
    - Cryptophyta

Silicoflagellates:
  class:
    - Dictyochophyceae
